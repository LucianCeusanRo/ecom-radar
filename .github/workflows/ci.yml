name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax and margin checks
        run: python tools/ci_check.py
      - name: Unit tests (offline: margin, rules, parsers, settings)
        run: python -m unittest discover -s tests -v
